model: lingbot_map
env: lingbot-map
_checkpoint: /path/to/lingbot-map.pt
# Device: cpu (portable default), cuda, or auto (CUDA only if free VRAM ≥ ~8 GiB).
# Laptop / low-VRAM GPUs should keep cpu — the checkpoint alone is ~4.4 GB.
_device: cpu
_mode: streaming
# AMP is ignored / disabled on CPU by the method wrapper.
_use_amp: true
# true = force SDPA. false = try FlashInfer on CUDA when installed; SDPA otherwise.
# FlashInfer is optional and not required for correct results.
_use_sdpa: true
_image_size: 518
_patch_size: 14
_enable_3d_rope: true
_num_scale_frames: 8
_max_frame_num: 1024
_kv_cache_sliding_window: 64
_kv_cache_scale_frames: 8
_keyframe_interval: auto         # auto = 1 if frames<=threshold else ceil(N/threshold); or a fixed int
_auto_keyframe_threshold: 320    # frame-count threshold driving the 'auto' keyframe_interval (streaming mode)
_area_budget: 255000
_align: 14
